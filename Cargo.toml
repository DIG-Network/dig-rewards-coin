# dig-rewards-coin — reward-distributor coin driver, on Chia.
#
# Like its 10-primitives sibling `dig-mirror-coin`, it deliberately does NOT depend on
# `datalayer-driver` and is not a re-export layer over anything. It performs no socket I/O: chain
# reads will arrive through the canonical caller-supplied `ChainSource` trait
# (dig-chainsource-interface, 00-foundation) when the withheld reader lands (#3267) — a
# 10-primitives crate never pulls a network stack down into itself, and it may never depend on a
# same-level crate such as `chia-query` or `dig-mirror-coin`.
[package]
name = "dig-rewards-coin"
version = "0.2.0"
edition = "2021"
rust-version = "1.81.0"
description = "Reward-distributor coin driver for the DIG Network on Chia"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DIG-Network/dig-rewards-coin"
readme = "README.md"
keywords = ["chia", "dig", "cat", "rewards", "distributor"]
categories = ["cryptography::cryptocurrencies"]

# Agent instructions are not part of the crate. Without this they ride into the published tarball,
# which is IMMUTABLE — it happened to dig-mirror-coin 0.7.0, which shipped six
# `.claude/skills/**/SKILL.md` plus `AGENTS.md` and `CLAUDE.md` to every consumer, unfixably.
# `cargo package --list` is the only thing that proves this exclusion still bites.
exclude = [".claude", "AGENTS.md", "CLAUDE.md"]

# A crates.io version is IMMUTABLE, so every line below is a permanent pin on every consumer of
# 0.2.0. A crate the library does not compile against does not belong here: it constrains a
# consumer's resolver for nothing. `dig-chainsource-interface` is absent for that reason — its only
# consumer was the withheld `read_distributor`, so 0.2.0 has zero uses of it. It returns, purely
# additively, when #3267 lands.
[dependencies]
dig-constants = "0.13.1"

# The chia line is the chia-wallet-sdk ceiling, and the ceiling is NOT one number: the primitives,
# the SDK crates, `chia-puzzles` and `clvmr` each cap at a different version. Normalising them to a
# single version would either strand this crate below the SDK or move it past what the SDK can
# link — chia-sdk-driver 0.36.0 pins the 0.36.1 cohort; the primitives publish 0.48.x but taking
# that links two incompatible `chia-protocol` versions and `Bytes32` stops being one type.
chia-bls = "0.36.1"
# `ConsensusConstants` is a required argument of the upstream launch call, and it lives here.
chia-consensus = "0.36.1"
chia-protocol = "0.36.1"
chia-puzzle-types = "0.36.1"
# `action-layer` is what exposes the reward distributor at all; without it the crate cannot see it.
chia-sdk-driver = { version = "0.36.0", features = ["chip-0035", "action-layer"] }
chia-sdk-types = { version = "0.36.0", features = ["chip-0035", "action-layer"] }
hex = "0.4.3"
thiserror = "2.0.20"

[dev-dependencies]
anyhow = "1.0.100"
# Cohort crates only the TESTS name. `chia-puzzles`, `clvm-traits`, `clvm-utils` and `clvmr` are all
# reached transitively by the library through `chia-consensus`/`chia-sdk-driver`, so declaring them
# under `[dependencies]` added no capability — it only pinned four extra versions, immutably, in
# every consumer's resolution. Versions are unchanged: SPEC.md §0.5 pins the 0.36 cohort and a
# hash-moving bump is a wire-breaking event for an already-launched distributor.
chia-puzzles = "0.20.3"
clvm-traits = "0.36.1"
clvm-utils = "0.36.1"
clvmr = "0.16.2"
# The simulator harness the acceptance tests run against — `Simulator`, `Benchmark` and
# `BlsPairWithCoin` live here. Cohort-matched to `chia-sdk-driver` 0.36.0 on purpose: a test built
# on different puzzle bytes than the library would prove nothing about the library.
chia-sdk-test = "0.36.0"
